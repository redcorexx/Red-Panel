<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ویزارد رد پنل | Red Panel Wizard</title>
<meta name="theme-color" content="#faf7f1">
<style>
@font-face {
  font-family: 'Vazirmatn';
  src: url(data:font/woff2;base64,__FONT_B64__) format('woff2');
  font-weight: 100 900; font-style: normal; font-display: swap;
}
:root {
  --p-bg:#faf7f1; --p-surface:#f5f0e6; --p-raised:#fffdf8; --p-ink:#25251f;
  --p-muted:#7e786b; --p-faint:#a09a8b; --p-line:#ded7ca; --p-strong-line:#3b3930;
  --p-accent:#a64329; --p-accent-soft:#f2e6dc; --p-green:#315b4d; --p-amber:#ad7a2b; --p-red:#ab3e36;
  --p-serif: Georgia,'Times New Roman',serif;
}
html[data-mode="dark"] {
  --p-bg:#191814; --p-surface:#24211b; --p-raised:#211f19; --p-ink:#f0e9db;
  --p-muted:#b4aa98; --p-faint:#9b907d; --p-line:#484135; --p-strong-line:#c5bba8;
  --p-accent:#e08b69; --p-accent-soft:#38281f; --p-green:#9cc6ae; --p-amber:#dcb374; --p-red:#e19086;
  color-scheme: dark;
}
* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--p-bg); color:var(--p-ink); font-family:'Vazirmatn',Tahoma,system-ui,sans-serif; min-height:100svh; line-height:1.7; }
::selection { background:var(--p-accent); color:var(--p-bg); }
*::-webkit-scrollbar { width:8px; height:8px; } *::-webkit-scrollbar-thumb { background:var(--p-line); }
button,input,select { font-family:inherit; }
.app { width:min(660px,100% - 36px); margin-inline:auto; padding-bottom:70px; }
.imprint { display:flex; justify-content:space-between; align-items:center; padding:16px 0 10px; border-bottom:1px solid var(--p-line); gap:10px; }
.wordmark { display:inline-flex; align-items:center; gap:10px; font-size:24px; font-weight:800; line-height:1; }
.mark { display:inline-block; width:9px; height:22px; background:var(--p-accent); flex:none; }
.wordmark-en { font-family:var(--p-serif); font-size:15px; font-weight:400; letter-spacing:.2em; padding-inline-start:14px; border-inline-start:1px solid var(--p-line); }
.edition { color:var(--p-muted); font-size:11px; font-family:var(--p-serif); font-style:italic; text-align:end; }
.imprint-actions { display:flex; gap:8px; align-items:center; }
.icon-btn { width:34px; height:34px; display:inline-flex; align-items:center; justify-content:center; border:1px solid var(--p-line); background:transparent; color:var(--p-ink); font-size:13px; transition:.18s; cursor:pointer; }
.icon-btn:hover { color:var(--p-accent); background:var(--p-accent-soft); border-color:var(--p-accent); }
.icon-btn.lang { font:600 12px var(--p-serif); }
.pagebar { display:flex; justify-content:space-between; align-items:center; gap:16px; padding:18px 0 13px; border-bottom:4px double var(--p-strong-line); }
.page-title { display:flex; align-items:center; gap:12px; min-width:0; }
.page-title h1 { font-size:clamp(20px,3vw,27px); font-weight:750; line-height:1.45; }
.sec-num { font-family:var(--p-serif); font-style:italic; font-size:14px; color:var(--p-accent); padding-inline-end:12px; border-inline-end:1px solid var(--p-line); flex:none; }
a { color:var(--p-accent); text-underline-offset:4px; }
.card { background:var(--p-raised); border:1px solid var(--p-line); margin-top:22px; }
.card > .inner { padding:24px; }
.steps-list { font-size:13px; color:var(--p-muted); }
.steps-list li { margin-inline-start:18px; margin-bottom:6px; }
.steps-list b { color:var(--p-ink); }
label.f-label { display:block; font-size:12px; font-weight:600; color:var(--p-muted); margin:18px 0 6px; }
input[type=text],input[type=password],select { width:100%; background:var(--p-raised); border:1px solid var(--p-line); color:var(--p-ink); padding:12px 14px; font-size:14px; outline:none; transition:.15s; }
input:focus,select:focus { border-color:var(--p-accent); box-shadow:0 0 0 3px color-mix(in srgb,var(--p-accent) 16%,transparent); }
input::placeholder { color:var(--p-faint); }
.inp-wrap { position:relative; }
.eye { position:absolute; inset-inline-end:8px; top:50%; transform:translateY(-50%); border:0; background:none; color:var(--p-muted); cursor:pointer; font-size:14px; }
.btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; border:1px solid var(--p-strong-line); background:var(--p-raised); color:var(--p-ink); padding:11px 26px; font-size:13px; font-weight:600; transition:.18s; cursor:pointer; text-decoration:none; }
.btn:hover { background:var(--p-surface); }
.btn-primary { background:var(--p-ink); color:var(--p-bg); border-color:var(--p-ink); }
.btn-primary:hover { background:var(--p-accent); border-color:var(--p-accent); color:#fff; }
html[data-mode=dark] .btn-primary:hover { color:var(--p-bg); }
.btn-sm { padding:7px 14px; font-size:12px; }
.btn[disabled] { opacity:.45; pointer-events:none; }
.center { display:flex; justify-content:center; }
.logbox { background:var(--p-surface); border-top:1px solid var(--p-line); max-height:210px; overflow-y:auto; }
.logbox .lrow { display:flex; gap:10px; padding:9px 16px; font-size:12px; border-bottom:1px solid var(--p-line); align-items:flex-start; }
.logbox .lrow:last-child { border-bottom:0; }
.logbox .ico { width:18px; height:18px; flex:none; display:inline-flex; align-items:center; justify-content:center; border:1px solid var(--p-line); font-size:10px; color:var(--p-muted); margin-top:2px; }
.logbox .lrow.ok .ico { color:var(--p-green); border-color:var(--p-green); }
.logbox .lrow.err .ico { color:var(--p-red); border-color:var(--p-red); }
.logbox .lrow.run .ico { color:var(--p-amber); border-color:var(--p-amber); animation:pl 1s infinite alternate; }
@keyframes pl { to { opacity:.3; } }
.logbox .msg { overflow-wrap:anywhere; }
.logbox .dt { color:var(--p-faint); font-size:10px; direction:ltr; unicode-bidi:plaintext; }
.result { margin-top:22px; }
.result .big { display:block; background:var(--p-surface); border:1px solid var(--p-strong-line); outline:1px solid var(--p-line); outline-offset:4px; padding:18px; text-align:center; }
.result .big a { font-weight:700; direction:ltr; unicode-bidi:embed; word-break:break-all; font-size:14px; }
.kv { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:10px 2px; border-bottom:1px solid var(--p-line); font-size:13px; flex-wrap:wrap; }
.kv:last-child { border-bottom:0; }
.kv b { direction:ltr; unicode-bidi:embed; font-family:ui-monospace,monospace; font-size:12px; word-break:break-all; }
.notice { border:1px solid var(--p-line); border-inline-start:3px solid var(--p-amber); background:var(--p-surface); padding:11px 14px; font-size:12px; margin-top:14px; }
.notice.red { border-inline-start-color:var(--p-red); }
.notice.green { border-inline-start-color:var(--p-green); }
.panels { margin-top:26px; }
.p-item { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:12px 14px; border:1px solid var(--p-line); background:var(--p-surface); margin-top:8px; font-size:12px; flex-wrap:wrap; }
.p-item .nm { font-weight:700; font-size:13px; }
.p-item .ur { direction:ltr; unicode-bidi:embed; word-break:break-all; }
.row { display:flex; gap:8px; flex-wrap:wrap; }
.section-heading { display:flex; justify-content:space-between; align-items:center; gap:16px; border-top:2px solid var(--p-strong-line); padding:16px 0 10px; margin-top:28px; }
.section-heading h2 { display:flex; align-items:center; gap:10px; font-size:16px; font-weight:650; }
.section-heading h2::before { content:""; width:7px; height:7px; background:var(--p-accent); flex:none; }
.hidden { display:none !important; }
.muted { color:var(--p-muted); }
@media (max-width:560px){ .wordmark{font-size:20px;} .wordmark-en{font-size:12px;padding-inline-start:10px;} .edition{display:none;} .card>.inner{padding:18px;} }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="imprint">
      <span class="wordmark"><span class="mark"></span><span>رد پنل</span><span class="wordmark-en">RED PANEL</span></span>
      <div class="imprint-actions">
        <span class="edition" id="edition"></span>
        <button class="icon-btn lang" id="btn-lang" onclick="toggleLang()">EN</button>
        <button class="icon-btn" id="btn-theme" onclick="toggleTheme()">☾</button>
        <a class="icon-btn" href="https://github.com/redcorexx/Red-Panel" target="_blank" rel="noopener" title="GitHub">↗</a>
      </div>
    </div>
    <div class="pagebar">
      <div class="page-title"><span class="sec-num">01</span><h1 id="wz-title">ویزارد نصب</h1></div>
    </div>
  </header>

  <div class="card">
    <div class="inner">
      <p class="muted" id="wz-sub" style="font-size:13px;margin-bottom:12px"></p>
      <ol class="steps-list" id="wz-steps"></ol>

      <label class="f-label" id="lb-token">توکن API کلودفلر</label>
      <div class="inp-wrap">
        <input type="password" id="in-token" dir="ltr" autocomplete="off">
        <button class="eye" onclick="toggleEye()">👁</button>
      </div>

      <label class="f-label" id="lb-method">روش نصب</label>
      <select id="in-method">
        <option value="workers">Cloudflare Workers</option>
        <option value="pages">Cloudflare Pages</option>
      </select>

      <label class="f-label hidden" id="lb-account-wrap" style="display:none">حساب</label>
      <select id="in-account" class="hidden"></select>

      <div class="center" style="margin-top:22px">
        <button class="btn btn-primary" id="btn-install" onclick="doInstall()">☁ <span id="btn-install-txt"></span></button>
      </div>
      <div id="conn-notice" class="notice hidden"></div>
    </div>
    <div class="logbox" id="logbox">
      <div class="lrow"><span class="ico">•</span><span class="msg" id="standby-msg"></span></div>
    </div>
  </div>

  <div class="result hidden" id="result"></div>

  <div class="panels" id="panels"></div>
</div>

<script>
/* ================= RED PANEL WIZARD ================= */
const REPO = 'redcorexx/Red-Panel';
const CF_API = 'https://api.cloudflare.com/client/v4';
const LS_PANELS = 'redpanel_wizard_panels';
const LS_LANG = 'redpanel_wizard_lang';
const LS_THEME = 'redpanel_wizard_theme';
const BACKEND = !!document.querySelector('meta[name="wizard-backend"]');

const state = { token:'', accounts:[], accountId:'', proxyUrl:'', busy:false };

const I18N = {
  fa: {
    title:'ویزارد نصب', sub:'نصب خودکار رد پنل روی حساب کلودفلر شما — بدون خطا، در چند ثانیه',
    steps:[ '<a href="https://dash.cloudflare.com/sign-up" target="_blank">ثبت‌نام</a> و تأیید حساب کلودفلر.',
      '<a href="https://dash.cloudflare.com/profile/api-tokens/create" target="_blank">ساخت توکن</a> با دسترسی‌های <b>Account Settings: Read</b>، <b>Workers Scripts: Edit</b>، <b>D1: Edit</b> و <b>Pages: Edit</b> — سپس کپی کنید.',

      'بعد از نصب، <b>لینک خصوصی</b> می‌گیرید که نصب/به‌روزرسانی یک‌کلیک را برای همیشه ممکن می‌کند.' ],
    token:'توکن API کلودفلر', method:'روش نصب', install:'نصب', standby:'آماده به کار',
    needProxy:'مرورگر به API کلودفلر دسترسی مستقیم ندارد. لطفاً <b>پروکسی شخصی</b> بسازید (لینک راهنما پایین همین صفحه) و آدرسش را در فیلد پروکسی وارد کنید.',
    proxyField:'آدرس ورکر پروکسی (اختیاری)',
    validating:'بررسی توکن…', accounts:'حساب',
    stFetch:'دریافت کد رد پنل از مخزن', stD1:'ساخت پایگاه دادهٔ D1', stInject:'تزریق تنظیمات',
    stUpW:'استقرار روی Workers', stUpP:'استقرار روی Pages', stUrl:'ساخت آدرس پنل', stLink:'ساخت لینک خصوصی',
    done:'پنل شما آماده است!', updateDone:'به‌روزرسانی کامل شد!',
    panelUrl:'آدرس داشبورد', password:'رمز عبور', privLink:'لینک خصوصی (یک‌کلیک)', privateNote:'این لینک را privately نگه دارید — شامل رمز شماست.',
    copy:'کپی', copied:'کپی شد', open:'باز کردن ↗', save:'ذخیره در مرورگر',
    savedTitle:'پنل‌های این مرورگر', updateBtn:'به‌روزرسانی',
    errToken:'توکن معتبر نیست یا دسترسی‌ها کافی نیست', errFetch:'دریافت کد ناموفق بود', errD1:'ساخت D1 ناموفق بود',
    errDeploy:'استقرار ناموفق بود', errNet:'خطای شبکه', errAccounts:'حسابی پیدا نشد (دسترسی Account Settings: Read)',
    errNoProxy:'برای استفاده از نسخهٔ Pages-میزبانی‌شده، پروکسی لازم است',
    proxyGuide:'راهنمای پروکسی: کد <b>proxy/worker.js</b> مخزن را در یک Worker جدید کپی/Deploy کنید و آدرسش را وارد کنید.',
    editionPrefix:'ویرایش روزنامه‌ای · ',
    workers:'Cloudflare Workers', pages:'Cloudflare Pages',
    oneClick:'نصب یک‌کلیک',
  },
  en: {
    title:'Install Wizard', sub:'Automatic Red Panel deployment on your Cloudflare account — no mistakes, in seconds',
    steps:[ '<a href="https://dash.cloudflare.com/sign-up" target="_blank">Sign up</a> and verify a Cloudflare account.',
      '<a href="https://dash.cloudflare.com/profile/api-tokens/create" target="_blank">Create a token</a> with <b>Account Settings: Read</b>, <b>Workers Scripts: Edit</b>, <b>D1: Edit</b>, <b>Pages: Edit</b> — then copy it.',
      'Paste it here, choose the installation method and press <b>Install</b>.',
      'After installation you get a <b>Private Link</b> that enables one-click install/update forever.' ],
    token:'Cloudflare API token', method:'Installation method', install:'Install', standby:'Standby',
    needProxy:'The browser cannot reach the Cloudflare API directly. Build a <b>personal proxy</b> (guide below) and paste its URL in the proxy field.',
    proxyField:'Proxy worker URL (optional)',
    validating:'Validating…', accounts:'Account',
    stFetch:'Fetching Red Panel code from repository', stD1:'Creating D1 database', stInject:'Injecting configuration',
    stUpW:'Deploying to Workers', stUpP:'Deploying to Pages', stUrl:'Building panel URL', stLink:'Creating private link',
    done:'Your panel is ready!', updateDone:'Update complete!',
    panelUrl:'Dashboard URL', password:'Password', privLink:'Private link (one-click)', privateNote:'Keep this link private — it contains your password.',
    copy:'Copy', copied:'Copied', open:'Open ↗', save:'Save in browser',
    savedTitle:'Panels in this browser', updateBtn:'Update',
    errToken:'Invalid token or insufficient permissions', errFetch:'Failed to fetch code', errD1:'Failed to create D1',
    errDeploy:'Deployment failed', errNet:'Network error', errAccounts:'No accounts found (Account Settings: Read)',
    errNoProxy:'The hosted Pages edition needs a proxy worker',
    proxyGuide:'Proxy guide: copy <b>proxy/worker.js</b> from the repository into a new Worker, deploy it, and paste its URL.',
    editionPrefix:'Newspaper Edition · ',
    workers:'Cloudflare Workers', pages:'Cloudflare Pages',
    oneClick:'One-click install',
  }
};
let lang = localStorage.getItem(LS_LANG) || 'fa';
function t(k){ return (I18N[lang]||{})[k] ?? I18N.fa[k] ?? k; }
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function applyMeta(){
  document.documentElement.lang = lang; document.documentElement.dir = lang==='fa'?'rtl':'ltr';
  document.getElementById('btn-lang').textContent = lang==='fa'?'EN':'فا';
  const now=new Date(), loc=lang==='fa'?'fa-IR':'en-US';
  document.getElementById('edition').textContent = t('editionPrefix') + now.toLocaleDateString(loc,{weekday:'long'}) + (lang==='fa'?'، ':' — ') + now.toLocaleDateString(loc,{year:'numeric',month:'long',day:'numeric'});
}
function toggleLang(){ lang = lang==='fa'?'en':'fa'; localStorage.setItem(LS_LANG,lang); paintStatic(); }
function toggleTheme(){
  const h=document.documentElement, dark=h.getAttribute('data-mode')!=='dark';
  h.setAttribute('data-mode', dark?'dark':'light'); localStorage.setItem(LS_THEME, dark?'dark':'light');
  document.getElementById('btn-theme').textContent = dark?'☀':'☾';
}
(function(){ const th=localStorage.getItem(LS_THEME);
  if(th==='dark'||(!th&&matchMedia('(prefers-color-scheme: dark)').matches)){ document.documentElement.setAttribute('data-mode','dark'); document.getElementById('btn-theme').textContent='☀'; } })();

function paintStatic(){
  applyMeta();
  document.getElementById('wz-title').textContent = t('title');
  document.getElementById('wz-sub').textContent = t('sub');
  document.getElementById('wz-steps').innerHTML = t('steps').map(s=>'<li>'+s+'</li>').join('');
  document.getElementById('lb-token').textContent = t('token');
  document.getElementById('lb-method').textContent = t('method');
  document.getElementById('btn-install-txt').textContent = t('install');
  document.getElementById('standby-msg').textContent = t('standby');
  document.getElementById('in-token').placeholder = '*****';
  renderPanels();
  if (!BACKEND) injectProxyField();
  handlePrivateLink();
}

/* optional proxy field (non-backend editions) */
function injectProxyField(){
  if (document.getElementById('in-proxy')) return;
  const lb=document.createElement('label'); lb.className='f-label'; lb.id='lb-proxy'; lb.textContent=t('proxyField');
  const w=document.createElement('div'); w.className='inp-wrap';
  const inp=document.createElement('input'); inp.type='text'; inp.dir='ltr'; inp.id='in-proxy'; inp.placeholder='https://your-proxy.workers.dev';
  inp.oninput = e => state.proxyUrl = e.target.value.trim().replace(/\/+$/,'');
  w.appendChild(inp);
  const notice=document.createElement('div'); notice.className='notice'; notice.innerHTML = t('needProxy') + '<div class="muted" style="margin-top:6px">' + t('proxyGuide') + '</div>';
  const card=document.querySelector('.card .inner');
  card.insertBefore(lb, document.getElementById('btn-install').closest('.center'));
  card.insertBefore(w, document.getElementById('btn-install').closest('.center'));
  card.appendChild(notice);
}

/* ---------- logging ---------- */
function log(msg, status, detail){
  const box=document.getElementById('logbox');
  if (box.querySelector('#standby-msg')) box.innerHTML='';
  const row=document.createElement('div'); row.className='lrow '+(status||'');
  row.innerHTML = '<span class="ico">'+(status==='ok'?'✓':status==='err'?'✕':status==='run'?'…':'•')+'</span><div><div class="msg">'+esc(msg)+'</div>'+(detail?'<div class="dt">'+esc(detail)+'</div>':'')+'</div>';
  box.appendChild(row); box.scrollTop = box.scrollHeight;
  return row;
}
function setRow(row, status, detail){
  if(!row) return; row.className='lrow '+status;
  row.querySelector('.ico').textContent = status==='ok'?'✓':status==='err'?'✕':status==='run'?'…':'•';
  if(detail!==undefined){ let d=row.querySelector('.dt'); if(!d){ d=document.createElement('div'); d.className='dt'; row.querySelector('.msg').after(d);} d.textContent=detail; }
}
function logClear(){ document.getElementById('logbox').innerHTML=''; }

/* ---------- API plumbing ---------- */
async function cfFetch(path, options={}){
  const headers = Object.assign({}, options.headers||{});
  if (state.token && !headers['Authorization']) headers['Authorization'] = 'Bearer ' + state.token;
  let url = CF_API + path;
  const opts = { method: options.method||'GET', headers };
  if (options.body instanceof FormData) opts.body = options.body;
  else if (options.body !== undefined){ headers['Content-Type']='application/json'; opts.body=options.body; }
  if (BACKEND) { url = '/api/cf' + path; }            /* server-side proxy */
  else if (state.proxyUrl) { url = state.proxyUrl + '/?url=' + encodeURIComponent(CF_API + path); }
  try {
    const res = await fetch(url, opts);
    let data=null; try { data = await res.json(); } catch(e){}
    if (data && typeof data==='object'){ data._status=res.status; return data; }
    return { success:false, errors:[{message:'HTTP '+res.status}], _status:res.status };
  } catch(e){ return { success:false, errors:[{message:String(e&&e.message||e)}], _network:true }; }
}
async function ghFetch(file){
  const srcs = [
    `https://cdn.jsdelivr.net/gh/${REPO}@main/${file}`,
    `https://raw.githubusercontent.com/${REPO}/refs/heads/main/${file}`,
  ];
  if (BACKEND) srcs.unshift('/api/gh/' + file);
  else if (state.proxyUrl) srcs.push(state.proxyUrl + '/?url=' + encodeURIComponent(`https://raw.githubusercontent.com/${REPO}/refs/heads/main/${file}`));
  for (const u of srcs){
    try { const r = await fetch(u); if (r.ok){ const txt = await r.text(); if (txt && txt.length>1000) return txt; } } catch(e){}
  }
  return null;
}

/* ---------- deploy ---------- */
function randName(){ return 'red-panel-' + Math.random().toString(36).slice(2,6); }
function randPass(){ const c='abcdefghjkmnpqrstuvwxyzABCDEFGHJKMNPQRSTUVWXYZ23456789'; let p=''; for(let i=0;i<12;i++)p+=c[Math.floor(Math.random()*c.length)]; return p; }
function injectConfig(code, cfg){
  let c=code; const set=(k,v)=>{ c=c.replace(new RegExp(`(${k}\\s*:\\s*)"[^"]*"`), `$1"${String(v).replace(/"/g,'')}"`); };
  set('masterKey',cfg.password); set('cfWorkerName',cfg.name); set('cfAccountId',cfg.accountId); set('cfApiToken',cfg.token);
  return c;
}
async function createD1(name){
  const r = await cfFetch(`/accounts/${state.accountId}/d1/database`, { method:'POST', body: JSON.stringify({ name }) });
  if (r.success) return { ok:true, id: r.result?.uuid || r.result?.database_id };
  if (/already/i.test(r.errors?.[0]?.message||'')) {
    const list = await cfFetch(`/accounts/${state.accountId}/d1/database`);
    const f = (list.result||[]).find(d=>d.name===name);
    if (f) return { ok:true, id:f.uuid, found:true };
  }
  return { ok:false, msg:r.errors?.[0]?.message };
}
async function uploadWorkers(name, code, bindings){
  const metadata = { main_module:'worker.js', compatibility_date:'2024-09-22', compatibility_flags:['nodejs_compat'], bindings };
  const form = new FormData();
  form.append('metadata', new Blob([JSON.stringify(metadata)], { type:'application/json' }));
  form.append('worker.js', new Blob([code], { type:'application/javascript+module' }), 'worker.js');
  const r = await cfFetch(`/accounts/${state.accountId}/workers/scripts/${encodeURIComponent(name)}`, { method:'PUT', body:form });
  return r.success ? { ok:true } : { ok:false, msg:r.errors?.[0]?.message };
}
async function deployPages(name, code){
  let p = await cfFetch(`/accounts/${state.accountId}/pages/projects`, { method:'POST', body: JSON.stringify({ name, production_branch:'main' }) });
  if (!p.success && !/exists/i.test(p.errors?.[0]?.message||'')) return { ok:false, msg:p.errors?.[0]?.message };
  const form = new FormData();
  form.append('branch','main');
  form.append('files[/_worker.js]', new Blob([code], { type:'application/javascript+module' }), '_worker.js');
  const d = await cfFetch(`/accounts/${state.accountId}/pages/projects/${encodeURIComponent(name)}/deployments`, { method:'POST', body:form });
  return d.success ? { ok:true, url:d.result?.url } : { ok:false, msg:d.errors?.[0]?.message };
}
async function getSubdomain(){
  const r = await cfFetch(`/accounts/${state.accountId}/workers/subdomain`);
  return r.success ? (r.result?.subdomain||'') : '';
}
async function getBindings(name){
  const s = await cfFetch(`/accounts/${state.accountId}/workers/scripts/${encodeURIComponent(name)}/settings`);
  return s.success && Array.isArray(s.result?.bindings) ? s.result.bindings : null;
}
function encodePriv(obj){ return btoa(unescape(encodeURIComponent(JSON.stringify(obj)))).replace(/=+$/,'').replace(/\+/g,'-').replace(/\//g,'_'); }
function decodePriv(s){ try { s=s.replace(/-/g,'+').replace(/_/g,'/'); return JSON.parse(decodeURIComponent(escape(atob(s)))); } catch(e){ return null; } }

/* ---------- panels ---------- */
function savePanels(){ try { return JSON.parse(localStorage.getItem(LS_PANELS)||'[]'); } catch(e){ return []; } }
function storePanel(p){ const l = savePanels().filter(x=>x.url!==p.url); l.unshift(p); localStorage.setItem(LS_PANELS, JSON.stringify(l.slice(0,10))); renderPanels(); }
function renderPanels(){
  const box=document.getElementById('panels'); const l=savePanels();
  box.innerHTML = l.length ? `<div class="section-heading"><h2>${t('savedTitle')}</h2></div>` + l.map((p,i)=>`
    <div class="p-item"><div><div class="nm">${esc(p.name)}</div><div class="ur">${esc(p.url)}</div></div>
    <div class="row">
      <a class="btn btn-sm" href="${esc(p.url)}/sync/dash" target="_blank" rel="noopener">${t('open')}</a>
      <button class="btn btn-sm" onclick="oneClickUpdate(${i})">${t('updateBtn')}</button>
    </div></div>`).join('') : '';
}

/* ---------- main flow ---------- */
async function doInstall(priv){
  if (state.busy) return;
  state.busy = true;
  const btn=document.getElementById('btn-install'); btn.disabled=true;
  document.getElementById('result').classList.add('hidden');
  logClear();
  state.token = priv ? priv.t : document.getElementById('in-token').value.trim();
  const method = priv ? priv.m : document.getElementById('in-method').value;
  const name = priv ? priv.w : randName();
  const password = priv ? priv.pw : randPass();
  try {
    /* 1. accounts */
    let row = log(t('validating'),'run');
    let acc;
    if (priv && priv.a) { acc = { result:[{ id:priv.a, name:'account' }] }; }
    else {
      const v = await cfFetch('/user/tokens/verify');
      if (!v.success || v.result?.status!=='active') throw new Error(t('errToken'));
      acc = await cfFetch('/accounts?per_page=50');
      if (!acc.success || !acc.result?.length) throw new Error(t('errAccounts'));
    }
    state.accounts = acc.result;
    state.accountId = priv?.a || acc.result[0].id;
    setRow(row,'ok', state.accountId.slice(0,8)+'…');

    /* 2. fetch code */
    row = log(t('stFetch'),'run');
    const code = await ghFetch('_worker.js');
    if (!code) throw new Error(t('errFetch'));
    const vm = code.match(/const\s+CURRENT_VERSION\s*=\s*["']([^"']+)["']/);
    setRow(row,'ok', vm ? 'v'+vm[1] : '');

    let deployUrl = '';
    let bindings = null;

    if (method === 'workers') {
      /* 3. D1 */
      row = log(t('stD1'),'run');
      const d = await createD1(name + '-db');
      if (!d.ok) throw new Error(t('errD1') + ' — ' + (d.msg||''));
      setRow(row,'ok', name+'-db');
      bindings = [{ name:'IOT_DB', type:'d1', id:d.id }];

      /* 4. inject */
      row = log(t('stInject'),'run');
      const injected = injectConfig(code, { password, name, accountId: state.accountId, token: state.token });
      setRow(row,'ok');

      /* 5. upload */
      row = log(t('stUpW'),'run');
      const u = await uploadWorkers(name, injected, bindings);
      if (!u.ok) throw new Error(t('errDeploy') + ' — ' + (u.msg||''));
      setRow(row,'ok', name);

      /* 6. url */
      row = log(t('stUrl'),'run');
      const sub = await getSubdomain();
      if (!sub) throw new Error('workers.dev subdomain missing');
      deployUrl = `https://${name}.${sub}.workers.dev`;
      setRow(row,'ok', deployUrl);
    } else {
      /* pages: inject only identity bits (no D1 — pages uses own KV? keep D1 too) */
      row = log(t('stD1'),'run');
      const d = await createD1(name + '-db');
      if (!d.ok) throw new Error(t('errD1') + ' — ' + (d.msg||''));
      setRow(row,'ok', name+'-db');
      row = log(t('stInject'),'run');
      /* Pages can't bind D1 in _worker.js upload API; inject dbName via vars instead */
      let injected = injectConfig(code, { password, name, accountId: state.accountId, token: state.token });
      setRow(row,'ok');
      row = log(t('stUpP'),'run');
      const p = await deployPages(name, injected);
      if (!p.ok) throw new Error(t('errDeploy') + ' — ' + (p.msg||''));
      deployUrl = p.url || `https://${name}.pages.dev`;
      setRow(row,'ok', deployUrl);
    }

    /* 7. private link */
    row = log(t('stLink'),'run');
    const privObj = { a:state.accountId, m:method, w:name, pw:password, t:state.token };
    const privLink = location.origin + location.pathname + '#p=' + encodePriv(privObj);
    setRow(row,'ok');

    showResult({ url: deployUrl, password, privLink, method });
    storePanel({ name, url: deployUrl, method, date: Date.now() });
    log(t('done'),'ok');
  } catch(e) {
    log(String(e.message||e),'err');
  }
  state.busy=false; btn.disabled=false;
}

async function oneClickUpdate(i){
  const p = savePanels()[i]; if (!p) return;
  /* update uses saved name + current token (ask inline) */
  state.token = document.getElementById('in-token').value.trim() || state.token;
  if (!state.token) { document.getElementById('in-token').focus(); return; }
  const v = await cfFetch('/user/tokens/verify');
  if (!v.success) { log(t('errToken'),'err'); return; }
  const acc = await cfFetch('/accounts?per_page=50');
  state.accounts = acc.result||[]; state.accountId = (acc.result||[])[0]?.id;
  state.busy=true; logClear();
  const code = await ghFetch('_worker.js');
  if (!code) { log(t('errFetch'),'err'); state.busy=false; return; }
  let u;
  if (p.method === 'pages') {
    u = await deployPages(p.name, code);
  } else {
    const bindings = await getBindings(p.name);
    if (!bindings || !bindings.some(b=>b.type==='d1')) { log(t('errDeploy') + ' — D1 binding not found','err'); state.busy=false; return; }
    u = await uploadWorkers(p.name, code, bindings);
  }
  const row = log(p.method === 'pages' ? t('stUpP') : t('stUpW'),'run');
  setRow(row, u.ok?'ok':'err', u.msg||p.url);
  if (u.ok) log(t('updateDone'),'ok');
  state.busy=false;
}

function handlePrivateLink(){
  const m = location.hash.match(/#p=([A-Za-z0-9\-_]+)/);
  if (!m) return;
  const obj = decodePriv(m[1]);
  if (obj && obj.t) {
    document.getElementById('in-token').value = obj.t;
    document.getElementById('in-method').value = obj.m || 'workers';
    const banner = document.createElement('div');
    banner.className='notice green'; banner.style.marginTop='14px';
    banner.innerHTML = '<b>'+t('oneClick')+'</b> — ' + esc(obj.w||'');
    const b=document.createElement('button'); b.className='btn btn-primary btn-sm'; b.style.marginInlineStart='10px';
    b.textContent=t('install'); b.onclick=()=>{ banner.remove(); doInstall(obj); };
    banner.appendChild(b);
    document.querySelector('.card .inner').appendChild(banner);
  }
}

function showResult(r){
  const box=document.getElementById('result'); box.classList.remove('hidden');
  box.innerHTML = `
    <div class="section-heading"><h2>${t('done')}</h2></div>
    <div class="card"><div style="padding:20px">
      <div class="kv"><span>${t('panelUrl')}</span><b>${esc(r.url)}</b></div>
      <div class="kv"><span>${t('password')}</span><b>${esc(r.password)}</b></div>
      <div class="kv"><span>${t('method')}</span><b>${esc(t(r.method==='workers'?'workers':'pages'))}</b></div>
      <div class="row" style="margin-top:14px">
        <a class="btn btn-primary" href="${esc(r.url)}/sync/dash" target="_blank" rel="noopener">${t('open')}</a>
        <button class="btn" onclick="cp('${esc(r.url)}',this)">${t('copy')}</button>
      </div>
      <div class="big" style="margin-top:16px"><span class="muted" style="font-size:11px">${t('privLink')}</span><br><a href="${esc(r.privLink)}">${esc(r.privLink)}</a></div>
      <div class="row" style="margin-top:10px;justify-content:center">
        <button class="btn btn-sm" onclick="cp('${esc(r.privLink)}',this)">${t('copy')}</button>
      </div>
      <p class="muted" style="font-size:11px;margin-top:10px">${t('privateNote')}</p>
    </div></div>`;
  box.scrollIntoView({ behavior:'smooth', block:'start' });
}
function cp(text, btn){
  navigator.clipboard.writeText(text).then(()=>{ const o=btn.textContent; btn.textContent=t('copied'); setTimeout(()=>btn.textContent=o,1400); });
}
function toggleEye(){ const i=document.getElementById('in-token'); i.type = i.type==='password'?'text':'password'; }

paintStatic();
</script>
